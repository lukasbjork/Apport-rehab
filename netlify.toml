[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify serverar kataloger med index.html på /sokvag/ och redirectar
# /sokvag → /sokvag/. Det matchar Astros trailingSlash: 'always' och därmed
# alla canonical-URL:er.
#
# Sajtens processing_settings har pretty_urls = true. Det är verifierat
# ofarligt här: inställningen tar bort .html-ändelser, men eftersom Astro
# bygger katalog/index.html finns inga .html-URL:er att strippa, och
# redirecten går TILL avslutande snedstreck, inte från.
#
# ignore_html_forms måste vara FALSE för att kontaktformuläret ska fungera.
# Netlify sätter true på nya sajter, vilket gör att formulär tyst inte
# registreras. Ändras via API: updateSite med processing_settings.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 404-sidan Astro genererar
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
